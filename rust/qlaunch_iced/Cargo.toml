[package]
name = "qlaunch_iced"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "qlaunch-iced"
path = "src/main.rs"

[dependencies]
qlaunch_core = { path = "../qlaunch_core", default-features = false }
# Android inherits premultiplied surface alpha. Use iced's default web-colors
# blend space (not linear-light sRGB) to match Flutter and Android composition.
iced = { git = "https://github.com/Santuzius/iced", tag = "iced_android-v0.1.1", default-features = false, features = ["wgpu", "tokio", "image", "wayland", "advanced", "web-colors"] }
iced_android = { git = "https://github.com/Santuzius/iced_android", tag = "v0.1.1" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time"] }
futures = { version = "0.3", features = ["executor"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
